# omarchy-stream baseline for Sunshine on Hyprland (Linux).
# Frame rate, resolution and bitrate are chosen by the Moonlight client, not here.

# KMS capture: smoothest on Hyprland. Needs: sudo setcap cap_sys_admin+p $(readlink -f $(which sunshine))
capture = kms

# NVIDIA. For AMD/Intel use: encoder = vaapi
encoder = nvenc
# P1 = fastest preset, lowest encode latency
nvenc_preset = 1

# Forward error correction share. 20 suits Wi-Fi; drop to 10 on a clean wired path.
fec_percentage = 20

min_log_level = info

# Deliberately absent (Windows-only, ignored on Linux):
#   nvenc_realtime_hags, nvenc_latency_over_power
# Deliberately absent: minimum_fps_target (a low floor makes the cursor feel laggy).
